<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NFT Preview Card</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="shortcut icon"
      href="/nft-preview-card-component-main/images/favicon-32x32.png"
      type="image/x-icon"
    />
  </head>
  <body>
    <div class="preview-card">
      <img
        src="/nft-preview-card-component-main/images/image-equilibrium.jpg"
        alt="equilibrium image"
      />
      <h3>Equilibrium #3429</h3>
      <p>Our Equilibrium collection promotes balance and calm.</p>
      <img
        id="ethereum"
        src="/nft-preview-card-component-main/images/icon-ethereum.svg"
        alt=""
      />
      <span class="num"> 0.041 ETH</span>
      <img
        src="/nft-preview-card-component-main/images/icon-clock.svg"
        alt=""
      />
      <span class="time">3 days left</span>
      <hr />
      <div class="foot-part">
        <img
          class="image-avatar"
          src="/nft-preview-card-component-main/images/image-avatar.png"
          alt=""
        />

        <h5 class="last-part">Creation of <hilight>Jules Wyvern</hilight></h5>
      </div>
    </div>
  </body>
</html>
